<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBuddy - AI Workout Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
      background: #0d0d0d url('/static/images/gym-bg.jpg') center / cover fixed no-repeat;
      display: flex; justify-content: center; align-items: center; padding: 20px;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: linear-gradient(135deg, rgba(15,10,40,0.82) 0%, rgba(5,5,20,0.75) 100%);
      z-index: 0;
    }

    .container {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.1);
      width: 100%; max-width: 620px;
      padding: 42px 44px;
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .logo-tag {
      text-align: center;
      font-family: 'Bebas Neue', cursive;
      font-size: 0.95rem;
      letter-spacing: 5px;
      color: #f97316;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h1 {
      text-align: center;
      font-family: 'Bebas Neue', cursive;
      font-size: 3.2rem;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #f97316, #facc15, #f97316);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s infinite linear;
      margin-bottom: 6px;
    }

    @keyframes shimmer {
      0% { background-position: 0% }
      100% { background-position: 200% }
    }

    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.45);
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(249,115,22,0.5), transparent);
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }

    input, select {
      width: 100%;
      padding: 13px 16px;
      font-size: 1rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
      outline: none;
    }
    input::placeholder { color: rgba(255,255,255,0.25); }
    input:focus, select:focus {
      border-color: #f97316;
      background: rgba(249,115,22,0.08);
      box-shadow: 0 0 0 3px rgba(249,115,22,0.18);
    }
    select option { background: #1e1e2e; color: #fff; }

    button {
      width: 100%;
      margin-top: 26px;
      padding: 16px;
      font-size: 1.1rem;
      font-family: 'Bebas Neue', cursive;
      letter-spacing: 4px;
      color: #fff;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      box-shadow: 0 4px 24px rgba(249,115,22,0.45);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(249,115,22,0.6);
      filter: brightness(1.08);
    }
    button:active { transform: translateY(0); }
    button:disabled {
      background: rgba(249,115,22,0.3);
      cursor: wait;
      transform: none;
      box-shadow: none;
    }

    .error {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .links { text-align: center; margin-top: 20px; }
    .links a {
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .links a:hover { color: #f97316; }

    .hint {
      color: #facc15;
      font-size: 0.82rem;
      text-align: center;
      margin-top: 12px;
      display: none;
      font-weight: 600;
      letter-spacing: 0.5px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (max-width: 600px) {
      .container { padding: 28px 20px; }
      h1 { font-size: 2.4rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-tag">⚡ Powered by Gemini AI</div>
    <h1>💪 FITBUDDY</h1>
    <p class="subtitle">YOUR PERSONALIZED AI FITNESS COACH</p>
    <div class="divider"></div>

    {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}

    <form id="planForm" action="/generate-workout" method="post">
      <label for="username">Your Name</label>
      <input type="text" id="username" name="username" placeholder="e.g. Alex Johnson" value="{{ form.get('username', '') }}" required maxlength="100">

      <label for="user_id">User ID</label>
      <input type="number" id="user_id" name="user_id" min="1" placeholder="e.g. 101" value="{{ form.get('user_id', '') }}" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" min="10" max="100" placeholder="e.g. 25" value="{{ form.get('age', '') }}" required>

      <label for="weight">Weight (kg)</label>
      <input type="number" id="weight" name="weight" min="20" max="400" step="0.1" placeholder="e.g. 72.5" value="{{ form.get('weight', '') }}" required>

      <label for="goal">Fitness Goal</label>
      <input type="text" id="goal" name="goal" placeholder="e.g. weight loss, build muscle, flexibility"
             value="{{ form.get('goal', '') }}" required maxlength="100">

      <label for="intensity">Workout Intensity</label>
      <select id="intensity" name="intensity" required>
        {% set sel = form.get('intensity', 'low')|lower %}
        <option value="low"    {{ 'selected' if sel == 'low' }}>🟢 Low — Beginner Friendly</option>
        <option value="medium" {{ 'selected' if sel == 'medium' }}>🟡 Medium — Keep Pushing</option>
        <option value="high"   {{ 'selected' if sel == 'high' }}>🔴 High — Beast Mode</option>
      </select>

      <button type="submit" id="submitBtn">⚡ GENERATE MY PLAN</button>
      <div class="hint" id="hint">🔥 Generating your plan with Gemini AI — up to a minute...</div>
    </form>

    <div class="links"><a href="/view-all-users">👥 Admin Dashboard</a></div>
  </div>

  <script>
    document.getElementById('planForm').addEventListener('submit', function () {
      var b = document.getElementById('submitBtn');
      b.disabled = true; b.textContent = 'GENERATING...';
      document.getElementById('hint').style.display = 'block';
    });
  </script>
</body>
</html>
